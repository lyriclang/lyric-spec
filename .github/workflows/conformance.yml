# The suite runs against a RELEASED toolchain, never a working tree. There is no Lyric 5 release
# yet, so there is nothing to pin: until 5.0.0 the toolchain repository's CI runs the suite
# against its own tree. The 4.x workflow, pinned to its release, lives on the 'script' branch.
name: Conformance

on:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nothing to pin before 5.0.0
        run: echo "no Lyric 5 release exists; see the comment at the top of this workflow"
