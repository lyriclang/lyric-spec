# Until a 5.0 toolchain is released there is nothing pinned to run the suite against, and the
# working tree of the compiler is the compiler's own business: lyriclang/lyric runs this suite
# in its CI (job "Conformance gate") against every commit, in both profiles. What this
# repository can check on its own is the suite itself: every header well-formed.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every case header is well-formed
        run: python3 tools/run_conformance.py --parse-only
